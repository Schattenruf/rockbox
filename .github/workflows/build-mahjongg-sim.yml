name: Run Mahjongg Rockbox Simulator Screenshot

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            perl \
            python3 \
            libsdl2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libpng-dev \
            zip \
            xvfb \
            xdotool \
            imagemagick

      - name: Configure iPod Classic simulator
        run: |
          mkdir build-sim
          cd build-sim
          ../tools/configure --target=29 --type=S

      - name: Build simulator
        run: |
          cd build-sim
          make -j2

      - name: Install simulator files into simdisk
        run: |
          cd build-sim
          make install

      - name: Run Mahjongg plugin and capture screenshots
        run: |
          cd build-sim

          # Put plugin directly into simulated disk root
          cp apps/plugins/mahjongg.rock simdisk/mahjongg.rock

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99

          ./rockboxui > simulator.log 2>&1 &
          SIM_PID=$!

          sleep 8

          # Find and focus simulator window
          xdotool search --onlyvisible --name "Rockbox" > windows.txt || true
          cat windows.txt || true

          WIN_ID=$(head -n 1 windows.txt || true)

          if [ -n "$WIN_ID" ]; then
            xdotool windowactivate "$WIN_ID" || true
            xdotool windowfocus "$WIN_ID" || true
            sleep 1
          fi

          import -window root screenshot-01-main-menu.png || true

          # Try several possible Select key variants.
          # On some systems numpad 5 is KP_5, on others it behaves as KP_Begin.
          xdotool key --clearmodifiers KP_5 || true
          sleep 1
          xdotool key --clearmodifiers KP_Begin || true
          sleep 1
          xdotool key --clearmodifiers Return || true
          sleep 3

          import -window root screenshot-02-after-select.png || true

          # Try select again to launch mahjongg.rock if we are in Files.
          xdotool key --clearmodifiers KP_5 || true
          sleep 1
          xdotool key --clearmodifiers KP_Begin || true
          sleep 1
          xdotool key --clearmodifiers Return || true
          sleep 4

          import -window root screenshot-03-after-second-select.png || true

          kill $SIM_PID || true
          kill $XVFB_PID || true
          
      - name: Upload simulator screenshots and logs
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-mahjongg-run
          path: |
            build-sim/screenshot-01-main-menu.png
            build-sim/screenshot-02-after-select.png
            build-sim/screenshot-03-after-second-select.png
            build-sim/simulator.log
            build-sim/windows.txt
            build-sim/apps/plugins/mahjongg.rock
            build-sim/apps/plugins/mahjongg.elf
            build-sim/apps/plugins/mahjongg.map
