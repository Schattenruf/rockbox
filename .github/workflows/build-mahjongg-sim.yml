name: Run Mahjongg Rockbox Simulator Screenshot

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            perl \
            python3 \
            libsdl2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libpng-dev \
            zip \
            xvfb \
            xdotool \
            imagemagick

      - name: Configure iPod Classic simulator
        run: |
          mkdir build-sim
          cd build-sim
          ../tools/configure --target=29 --type=S

      - name: Build simulator
        run: |
          cd build-sim
          make -j2

      - name: Install simulator files into simdisk
        run: |
          cd build-sim
          make install

      - name: Run Mahjongg plugin and capture screenshots
        run: |
          cd build-sim

          # Put plugin directly into simulated disk root
          cp apps/plugins/mahjongg.rock simdisk/mahjongg.rock

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99

          ./rockboxui > simulator.log 2>&1 &
          SIM_PID=$!

          sleep 8
          import -window root screenshot-01-main-menu.png || true

          # Click iPod center/select button.
          # Coordinates are based on the 1024x768 screenshot:
          # center button is visually around x=512, y=526.
          xdotool mousemove 512 526 click 1
          sleep 3
          import -window root screenshot-02-after-center-click.png || true

          # Click center/select again.
          # If File browser opened and mahjongg.rock is selected,
          # this should launch the plugin.
          xdotool mousemove 512 526 click 1
          sleep 5
          import -window root screenshot-03-after-second-center-click.png || true

          # Try one more center click in case the file browser needs it.
          xdotool mousemove 512 526 click 1
          sleep 5
          import -window root screenshot-04-after-third-center-click.png || true

          kill $SIM_PID || true
          kill $XVFB_PID || true
          
      - name: Upload simulator screenshots and logs
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-mahjongg-run
          path: |
            build-sim/screenshot-01-main-menu.png
            build-sim/screenshot-02-after-center-click.png
            build-sim/screenshot-03-after-second-center-click.png
            build-sim/screenshot-04-after-third-center-click.png
            build-sim/simulator.log
            build-sim/apps/plugins/mahjongg.rock
            build-sim/apps/plugins/mahjongg.elf
            build-sim/apps/plugins/mahjongg.map
