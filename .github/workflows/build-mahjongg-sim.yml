name: Run Mahjongg Rockbox Simulator Screenshot

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            perl \
            python3 \
            libsdl2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libpng-dev \
            zip \
            xvfb \
            xdotool \
            imagemagick

      - name: Configure iPod Classic simulator
        run: |
          mkdir build-sim
          cd build-sim
          ../tools/configure --target=29 --type=S

      - name: Build simulator
        run: |
          cd build-sim
          make -j2

      - name: Install simulator files into simdisk
        run: |
          cd build-sim
          make install

      - name: Run Mahjongg plugin and capture screenshots
        run: |
          cd build-sim

          # Put the plugin directly into the simulated disk root
          cp apps/plugins/mahjongg.rock simdisk/mahjongg.rock

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99

          ./rockboxui > simulator.log 2>&1 &
          SIM_PID=$!

          # Wait for Rockbox main menu
          sleep 8
          import -window root screenshot-01-main-menu.png || true

          # The simulator skin shows numeric keypad mappings.
          # KP_5 should press the iPod center/select button.
          # First KP_5 enters Files.
          xdotool key KP_5
          sleep 2
          import -window root screenshot-02-files.png || true

          # Second KP_5 should launch mahjongg.rock if it is selected.
          xdotool key KP_5
          sleep 4
          import -window root screenshot-03-mahjongg.png || true

          kill $SIM_PID || true
          kill $XVFB_PID || true

      - name: Upload simulator screenshots and logs
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-mahjongg-run
          path: |
            build-sim/screenshot-01-main-menu.png
            build-sim/screenshot-02-files.png
            build-sim/screenshot-03-mahjongg.png
            build-sim/simulator.log
            build-sim/apps/plugins/mahjongg.rock
            build-sim/apps/plugins/mahjongg.elf
            build-sim/apps/plugins/mahjongg.map
