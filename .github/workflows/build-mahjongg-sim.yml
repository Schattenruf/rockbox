name: Run Mahjongg Rockbox Simulator Screenshot

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            perl \
            python3 \
            libsdl2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libpng-dev \
            zip \
            xvfb \
            xdotool \
            imagemagick \
            x11-utils \
            scrot \
            openbox

      - name: Configure iPod Classic simulator
        run: |
          mkdir build-sim
          cd build-sim
          ../tools/configure --target=29 --type=S

      - name: Build simulator
        run: |
          cd build-sim
          make -j2

      - name: Install simulator files into simdisk
        run: |
          cd build-sim
          make install

      - name: Run Mahjongg plugin through iPod 6G simulator
        run: |
          cd build-sim

          cp apps/plugins/mahjongg.rock simdisk/mahjongg.rock || true

          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=dummy

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99

          openbox > openbox.log 2>&1 &
          OPENBOX_PID=$!

          sleep 2

          ./rockboxui > simulator.log 2>&1 &
          SIM_PID=$!

          sleep 10

          echo "=== Window tree ===" > debug.txt
          xwininfo -root -tree >> debug.txt || true

          echo "=== Search iPod 6G ===" >> debug.txt
          xdotool search --name "iPod 6G" >> debug.txt 2>&1 || true

          WIN_ID=$(xdotool search --name "iPod 6G" | head -n 1 || true)
          echo "WIN_ID=$WIN_ID" >> debug.txt

          if [ -n "$WIN_ID" ]; then
            xdotool windowactivate "$WIN_ID" || true
            xdotool windowfocus "$WIN_ID" || true
            sleep 1

            import -window "$WIN_ID" screenshot-01-ipod-main.png || true

            # Center/select button, relative to the iPod 6G window.
            # Window is 350x591. Center button is roughly x=175,y=418.
            xdotool mousemove --window "$WIN_ID" 175 418 click 1
            sleep 3
            import -window "$WIN_ID" screenshot-02-after-files-select.png || true

            # Select again, should launch mahjongg.rock if selected in Files.
            xdotool mousemove --window "$WIN_ID" 175 418 click 1
            sleep 5
            import -window "$WIN_ID" screenshot-03-after-plugin-select.png || true

            # One extra select just in case the file browser needed another entry.
            xdotool mousemove --window "$WIN_ID" 175 418 click 1
            sleep 5
            import -window "$WIN_ID" screenshot-04-after-third-select.png || true
          fi

          echo "=== Simulator log ===" >> debug.txt
          cat simulator.log >> debug.txt || true

          kill $SIM_PID || true
          kill $OPENBOX_PID || true
          kill $XVFB_PID || true
          
      - name: Upload simulator run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-mahjongg-run
          path: |
            build-sim/debug.txt
            build-sim/simulator.log
            build-sim/openbox.log
            build-sim/screenshot-01-ipod-main.png
            build-sim/screenshot-02-after-files-select.png
            build-sim/screenshot-03-after-plugin-select.png
            build-sim/screenshot-04-after-third-select.png
            build-sim/apps/plugins/mahjongg.rock
            build-sim/apps/plugins/mahjongg.elf
            build-sim/apps/plugins/mahjongg.map
