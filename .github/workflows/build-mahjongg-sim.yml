name: Run Mahjongg Rockbox Simulator Screenshot

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            perl \
            python3 \
            libsdl2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libpng-dev \
            zip \
            xvfb \
            xdotool \
            imagemagick

      - name: Configure iPod Classic simulator
        run: |
          mkdir build-sim
          cd build-sim
          ../tools/configure --target=29 --type=S

      - name: Build simulator
        run: |
          cd build-sim
          make -j2

      - name: Install simulator files into simdisk
        run: |
          cd build-sim
          make install

      - name: Run simulator debug capture
        run: |
          cd build-sim

          cp apps/plugins/mahjongg.rock simdisk/mahjongg.rock || true

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99

          sleep 2

          echo "=== DISPLAY ==="
          echo "$DISPLAY"

          echo "=== Starting rockboxui ==="
          ./rockboxui > simulator.log 2>&1 &
          SIM_PID=$!

          sleep 10

          echo "=== Process list ==="
          ps aux | grep rockboxui || true

          echo "=== Simulator log ==="
          cat simulator.log || true

          echo "=== X windows ==="
          xwininfo -root -tree > xwindows.txt || true
          cat xwindows.txt || true

          echo "=== xdotool search ==="
          xdotool search --all "" > xdotool-windows.txt || true
          cat xdotool-windows.txt || true

          import -window root screenshot-01-root.png || true

          WIN_ID=$(xdotool search --onlyvisible --name "Rockbox" | head -n 1 || true)
          echo "WIN_ID=$WIN_ID" > selected-window.txt

          if [ -n "$WIN_ID" ]; then
            xdotool windowactivate "$WIN_ID" || true
            xdotool windowfocus "$WIN_ID" || true
            sleep 2
            import -window "$WIN_ID" screenshot-02-rockbox-window.png || true
          fi

          kill $SIM_PID || true
          kill $XVFB_PID || true
          
      - name: Upload simulator debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-simulator-debug
          path: |
            build-sim/screenshot-01-root.png
            build-sim/screenshot-02-rockbox-window.png
            build-sim/simulator.log
            build-sim/xwindows.txt
            build-sim/xdotool-windows.txt
            build-sim/selected-window.txt
            build-sim/apps/plugins/mahjongg.rock
            build-sim/apps/plugins/mahjongg.elf
            build-sim/apps/plugins/mahjongg.map
