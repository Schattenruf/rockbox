name: Run Mahjongg Rockbox Simulator Screenshot

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            gcc \
            g++ \
            perl \
            python3 \
            libsdl2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libpng-dev \
            zip \
            xvfb \
            xdotool \
            imagemagick \
            x11-utils \
            scrot \
            openbox

      - name: Configure iPod Classic simulator
        run: |
          mkdir build-sim
          cd build-sim
          ../tools/configure --target=29 --type=S

      - name: Build simulator
        run: |
          cd build-sim
          make -j2

      - name: Install simulator files into simdisk
        run: |
          cd build-sim
          make install

      - name: Run simulator with debug logging
        run: |
          cd build-sim

          cp apps/plugins/mahjongg.rock simdisk/mahjongg.rock || true

          echo "=== Files in build-sim ===" > debug.txt
          ls -la >> debug.txt

          echo "=== Files in simdisk ===" >> debug.txt
          ls -la simdisk >> debug.txt || true

          echo "=== rockboxui file info ===" >> debug.txt
          file ./rockboxui >> debug.txt || true
          ldd ./rockboxui >> debug.txt || true

          export SDL_VIDEODRIVER=x11
          export SDL_AUDIODRIVER=dummy

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          export DISPLAY=:99

          sleep 2

          # Optional lightweight window manager, helps some SDL/X11 windows map correctly
          openbox > openbox.log 2>&1 &
          OPENBOX_PID=$!

          sleep 2

          echo "=== Starting rockboxui ===" >> debug.txt
          ./rockboxui > simulator.log 2>&1 &
          SIM_PID=$!

          sleep 15

          echo "=== Process list ===" >> debug.txt
          ps aux | grep -E "rockboxui|Xvfb|openbox" >> debug.txt || true

          echo "=== Simulator log ===" >> debug.txt
          cat simulator.log >> debug.txt || true

          echo "=== X window tree ===" >> debug.txt
          xwininfo -root -tree >> debug.txt || true

          echo "=== xdotool search Rockbox ===" >> debug.txt
          xdotool search --name "Rockbox" >> debug.txt 2>&1 || true

          echo "=== Screenshot root ===" >> debug.txt
          scrot screenshot-01-root.png || true
          import -window root screenshot-02-import-root.png || true

          WIN_ID=$(xdotool search --onlyvisible --name "Rockbox" | head -n 1 || true)
          echo "WIN_ID=$WIN_ID" >> debug.txt

          if [ -n "$WIN_ID" ]; then
            xdotool windowactivate "$WIN_ID" || true
            xdotool windowfocus "$WIN_ID" || true
            sleep 2

            import -window "$WIN_ID" screenshot-03-rockbox-window.png || true

            # Try center/select via mouse click, based on prior 1024x768 image
            xdotool mousemove 512 526 click 1 || true
            sleep 4
            import -window root screenshot-04-after-click.png || true
          fi

          kill $SIM_PID || true
          kill $OPENBOX_PID || true
          kill $XVFB_PID || true       
          
      - name: Upload simulator debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rockbox-simulator-debug
          path: |
            build-sim/debug.txt
            build-sim/simulator.log
            build-sim/openbox.log
            build-sim/screenshot-01-root.png
            build-sim/screenshot-02-import-root.png
            build-sim/screenshot-03-rockbox-window.png
            build-sim/screenshot-04-after-click.png
            build-sim/apps/plugins/mahjongg.rock
            build-sim/apps/plugins/mahjongg.elf
            build-sim/apps/plugins/mahjongg.map
